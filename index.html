<html lang="en">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Personal Website</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; }
